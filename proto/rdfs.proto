syntax = "proto3";

package rdfs;

message Empty {}

message FileInfo {
  uint64 inode = 1;
  string path = 2;
  uint64 size = 4;
  uint32 chunk_size = 5;
  bool is_dir = 6;
}

message ChunkReplica {
  string node_id = 1;
  string addr = 2;
}

message ErasureShard {
  string chunk_id = 1;
  string checksum = 2;
  ChunkReplica replica = 3;
}

// Erasure-coded chunk layout: the chunk's bytes are striped into
// data_shards shards of shard_size bytes (zero-padded) plus parity_shards
// parity shards; any data_shards of them reconstruct the chunk.
message ErasureInfo {
  uint32 data_shards = 1;
  uint32 parity_shards = 2;
  uint64 shard_size = 3;
  repeated ErasureShard shards = 4;
}

message ChunkRef {
  string chunk_id = 1;
  uint64 offset = 2;
  uint64 size = 3;
  string checksum = 4;
  repeated ChunkReplica replicas = 5;
  // Set for erasure-coded chunks; replicas is empty in that case.
  ErasureInfo erasure = 6;
}

message FileManifest {
  FileInfo info = 1;
  repeated ChunkRef chunks = 2;
}

message DirectoryEntry {
  string path = 1;
  string name = 2;
  bool is_dir = 3;
  uint64 size = 4;
}

enum UploadMode {
  UPLOAD_MODE_UNSPECIFIED = 0;
  UPLOAD_MODE_CREATE = 1;
  UPLOAD_MODE_OVERWRITE = 2;
  // Commits are appended after the file's existing chunks.
  UPLOAD_MODE_APPEND = 3;
  // Commits replace the byte range given by replace_from/replace_len in
  // CommitUploadRequest. The range must cover whole existing chunks.
  UPLOAD_MODE_REPLACE_RANGE = 4;
}

message UploadSession {
  string upload_id = 1;
  uint64 lease_expiry_unix_ms = 2;
  uint32 chunk_size = 4;
  uint32 replication_factor = 5;
  // Non-zero when the session stores chunks erasure-coded.
  uint32 data_shards = 6;
  uint32 parity_shards = 7;
}

message ChunkPlacement {
  string chunk_id = 1;
  repeated ChunkReplica replicas = 3;
  // For erasure-coded sessions: one placement per shard, in index order.
  repeated ErasureShard shards = 4;
}

message CommitChunk {
  string chunk_id = 1;
  uint64 offset = 2;
  uint64 size = 3;
  string checksum = 4;
  repeated ChunkReplica replicas = 5;
  ErasureInfo erasure = 6;
}

message InventoryChunk {
  string chunk_id = 1;
  string checksum = 3;
  uint64 size = 4;
}

message StatRequest {
  string path = 1;
}

message ListRequest {
  string path = 1;
}

message ListResponse {
  repeated DirectoryEntry entries = 1;
}

message MkdirRequest {
  string path = 1;
}

message DeleteRequest {
  string path = 1;
}

message OpenFileRequest {
  string path = 1;
}

message BeginUploadRequest {
  string path = 1;
  UploadMode mode = 2;
  uint32 replication_factor = 3;
  uint32 chunk_size = 4;
  // Non-zero to store the file's chunks erasure-coded instead of fully
  // replicated.
  uint32 data_shards = 5;
  uint32 parity_shards = 6;
}

message AllocateChunkRequest {
  string upload_id = 1;
  uint64 size = 2;
  string checksum = 3;
  // For erasure-coded sessions: checksums of the data_shards + parity_shards
  // shards, in index order, each shard_size bytes long.
  repeated string shard_checksums = 4;
  uint64 shard_size = 5;
}

message CommitUploadRequest {
  string upload_id = 1;
  repeated CommitChunk chunks = 2;
  // Byte range of the existing file replaced by this commit. Only read for
  // UPLOAD_MODE_REPLACE_RANGE sessions.
  uint64 replace_from = 3;
  uint64 replace_len = 4;
}

message ReportReplicaFailureRequest {
  string chunk_id = 1;
  string node_id = 2;
  string reason = 3;
}

message HeartbeatRequest {
  string node_id = 1;
  string addr = 2;
  uint64 capacity = 3;
  uint64 used = 4;
  // Full inventory, only populated when has_inventory is set. Chunkservers
  // send it on the first heartbeat to a leader, when it changes, or when the
  // leader requests a resend; liveness-only heartbeats omit it.
  repeated InventoryChunk inventory = 5;
  string inventory_digest = 6;
  bool has_inventory = 7;
}

message HeartbeatResponse {
  // Set when the leader's recorded inventory digest does not match the
  // reported one, asking the chunkserver to include its full inventory in
  // the next heartbeat.
  bool resend_inventory = 1;
}

message MetadataNodeInfo {
  uint64 id = 1;
  string addr = 2;
  bool voter = 3;
}

message ClusterMembership {
  repeated MetadataNodeInfo nodes = 1;
  bool joint = 2;
}

message AddMetadataNodeRequest {
  uint64 node_id = 1;
  string addr = 2;
  bool promote_to_voter = 3;
}

message RemoveMetadataNodeRequest {
  uint64 node_id = 1;
  bool retain_as_learner = 2;
}

message ReplaceMetadataNodeRequest {
  uint64 old_node_id = 1;
  uint64 new_node_id = 2;
  string new_addr = 3;
}

message PutChunkHeader {
  string chunk_id = 1;
  string checksum = 3;
  uint64 size = 4;
  repeated ChunkReplica forward_targets = 5;
}

message PutChunkRequest {
  oneof item {
    PutChunkHeader header = 1;
    bytes data = 2;
  }
}

message ChunkMetadata {
  string chunk_id = 1;
  string checksum = 3;
  uint64 size = 4;
  string node_id = 5;
}

message PutChunkResponse {
  ChunkReplica replica = 1;
}

message GetChunkRequest {
  string chunk_id = 1;
}

message GetChunkResponse {
  oneof item {
    ChunkMetadata metadata = 1;
    bytes data = 2;
  }
}

message DeleteChunkRequest {
  string chunk_id = 1;
}

message JsonEnvelope {
  bytes json = 1;
}

message InstallSnapshotRequest {
  bytes vote_json = 1;
  bytes meta_json = 2;
  bytes snapshot = 3;
}

service MetadataService {
  rpc Stat(StatRequest) returns (FileInfo);
  rpc List(ListRequest) returns (ListResponse);
  rpc Mkdir(MkdirRequest) returns (FileInfo);
  rpc Delete(DeleteRequest) returns (Empty);
  rpc OpenFile(OpenFileRequest) returns (FileManifest);
  rpc BeginUpload(BeginUploadRequest) returns (UploadSession);
  rpc AllocateChunk(AllocateChunkRequest) returns (ChunkPlacement);
  rpc CommitUpload(CommitUploadRequest) returns (FileManifest);
  rpc ReportReplicaFailure(ReportReplicaFailureRequest) returns (Empty);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc GetClusterMembership(Empty) returns (ClusterMembership);
  rpc AddMetadataNode(AddMetadataNodeRequest) returns (ClusterMembership);
  rpc RemoveMetadataNode(RemoveMetadataNodeRequest) returns (ClusterMembership);
  rpc ReplaceMetadataNode(ReplaceMetadataNodeRequest) returns (ClusterMembership);
}

service ChunkService {
  rpc PutChunk(stream PutChunkRequest) returns (PutChunkResponse);
  rpc GetChunk(GetChunkRequest) returns (stream GetChunkResponse);
  rpc DeleteChunk(DeleteChunkRequest) returns (Empty);
}

service RaftService {
  rpc AppendEntries(JsonEnvelope) returns (JsonEnvelope);
  rpc Vote(JsonEnvelope) returns (JsonEnvelope);
  rpc InstallSnapshot(InstallSnapshotRequest) returns (JsonEnvelope);
}
